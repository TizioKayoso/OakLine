[package]
name = "oakline"
version = "0.1.0"
edition = "2024"
description = "Map Minecraft railways over a shaded surface map"
rust-version = "1.88"
license = "GPL-3.0-only"
keywords = ["minecraft", "railway", "map", "anvil", "cli"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fastnbt = "2.6"
flate2 = "1.1"
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
lz4-java-wrc = "0.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
fastanvil = { version = "0.32", default-features = false }
